# SonarQube Cloud analysis for the .NET solution.
#
# Setup (one-time, outside this file):
#   - SonarQube Cloud project: Administration > Analysis Method > turn Automatic Analysis OFF
#     (CI analysis fails while it is on).
#   - Repo secret SONAR_TOKEN: a SonarQube Cloud token with "Execute Analysis" on this project.
#   - Repo secret CI_SQL_SA_PASSWORD: a throwaway SA password for the SQL Server container that the
#     integration and host tests run against (research R-14, ADR 0006). It must meet SQL Server's
#     password policy; use letters, digits and - or _ only, because it goes into connection strings.
#   - Optional repo variables SONAR_ORGANIZATION / SONAR_PROJECT_KEY if the keys differ from
#     the defaults below.
#
# The job skips cleanly while SONAR_TOKEN or CI_SQL_SA_PASSWORD is not set.

name: SonarQube Cloud

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'theyur' }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'theyur_agentic-engineering-course-exam' }}
  SOLUTION: HabitTracker.slnx
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Build, test and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so Sonar can attribute issues (blame) and detect new code.
          fetch-depth: 0

      - name: Check prerequisites
        id: pre
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CI_SQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        run: |
          missing=""
          if [ -z "$SONAR_TOKEN" ]; then missing="SONAR_TOKEN"; fi
          if [ -z "$CI_SQL_SA_PASSWORD" ]; then missing="${missing:+$missing and }CI_SQL_SA_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::notice::$missing not set; skipping SonarQube analysis."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Start SQL Server
        if: steps.pre.outputs.run == 'true'
        # A step, not a job-level service container: a service would start before the check above and
        # fail without the secret (research R-14). The password reaches docker through the environment
        # only (-e NAME without a value), so it is never on a command line or in the log.
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
          SQLCMDPASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        run: |
          docker run --detach --name ht-sql --publish 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2022-latest
          for _ in $(seq 1 60); do
            if docker exec -e SQLCMDPASSWORD ht-sql \
                 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SQL Server did not become ready within 120 seconds."
          docker logs ht-sql | tail -50
          exit 1

      - name: Set up JDK (required by the scanner)
        if: steps.pre.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET
        if: steps.pre.outputs.run == 'true'
        # setup-dotnet@v5 downloads from dotnetorigin.blob.core.windows.net, which answered HTTP 409
        # (2026-10-25, seen in another repo); v4 uses builds.dotnet.microsoft.com.
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarQube packages
        if: steps.pre.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install scanner and coverage tools
        if: steps.pre.outputs.run == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Build, test and analyze
        if: steps.pre.outputs.run == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # The integration and host tests run against the container (ADR 0006); the value is never echoed.
          HT_IT_CONNECTION: Server=localhost,1433;Database=HT-IT;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True
          HT_UI_CONNECTION: Server=localhost,1433;Database=HT-UI;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True
        # sonar.qualitygate.wait makes `end` block on the quality gate and fail this job when the
        # gate is red. The authoritative gate signal is still the "SonarCloud Code Analysis" check
        # (a run without SONAR_TOKEN or CI_SQL_SA_PASSWORD succeeds without analyzing); tools/pr-gates reads that check.
        # .specify/ is vendored Spec Kit tooling, refreshed by the Specify CLI; we don't maintain it.
        # tests/HT.AcceptanceTests/ is written by isolated AC subagents the main agent may not edit (ADR 0003).
        # Coverage is measured for .NET only, so repo scripts (tools/, .claude/hooks/) are excluded from
        # the coverage metric; they are still analyzed for issues and are tested by their own self-tests.
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.exclusions=".specify/**,tests/HT.AcceptanceTests/**" \
            /d:sonar.coverage.exclusions="tools/**,.claude/hooks/**" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage/coverage.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"
          dotnet build "$SOLUTION" --configuration Release
          dotnet-coverage collect \
            "dotnet test $SOLUTION --configuration Release --no-build --logger trx" \
            -f xml -o coverage/coverage.xml
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
