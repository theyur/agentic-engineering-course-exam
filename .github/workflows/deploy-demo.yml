# Deploys, refreshes or checks the hosted demo (ADR 0015, specs/003-demo-hosting/contracts/deploy-workflow.md).
#
# Step ids are s<n>_<k> and step names "<n>.<k> <text>", where <n> is the contract's step number; the contract
# is the only step numbering. Modes per contract step:
#   1-4  all (in check: only the smoke check is built)  |  5, 8-11  deploy, refresh  |  6, 7  deploy
#   12   all                                            |  13       always
#
# Setup (one-time, outside this file): tools/hosting/provision.ps1 creates the Azure resources, the federated
# credential and the GitHub environment `demo` (deployment branch policy: master only) with its variables.
# The environment has no secrets: step 3 reads the secret values from the web app at run time.
#
# Secret handling (contracts/hosted-configuration.md, "Never"):
#   - every value read in step 3 is masked with ::add-mask:: right after it is read, before it is written to a
#     step output; it reaches a command only through `env:`, never through `with:` or a command argument;
#   - no step echoes a secret, and no step uses `set -x`;
#   - Azure CLI commands that change something run with `--output none`, so no setting value reaches the log;
#   - the summary (13.2) reads step outcomes one by one, never toJSON(steps), which would carry step 3's outputs.

name: Deploy demo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy rolls out the commit; refresh empties the database and restarts the deployed commit; check runs only the smoke check"
        type: choice
        options:
          - deploy
          - refresh
          - check
        default: deploy
      commit:
        description: "Commit of master to deploy (full or short SHA, or master); ignored in refresh and check"
        type: string
        default: master

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  demo:
    name: Demo (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: demo
    # Expected about 10 minutes, at most 15 (SC-003); the limit only stops a hung run, and step 13 still runs.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Non-secret identifiers of the environment `demo`.
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.AZURE_WEBAPP_NAME }}
      SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
      SQL_DATABASE: ${{ vars.AZURE_SQL_DATABASE }}
      FIREWALL_RULE: deploy-demo-runner
    steps:
      # ---- 1: check the ref; Azure sign-in (all modes) ----
      - name: "1.1 Check the ref is master"
        id: s1_1
        env:
          REF: ${{ github.ref }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::this workflow runs only on master (ref: $REF)"
            exit 1
          fi
          case "$MODE" in
            deploy|refresh|check) ;;
            *) echo "::error::unknown mode: $MODE"; exit 1 ;;
          esac

      - name: "1.2 Sign in to Azure"
        id: s1_2
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---- 2: check out master and resolve the commit (all modes) ----
      - name: "2.1 Check out master"
        id: s2_1
        uses: actions/checkout@v5
        with:
          ref: master
          # Full history: 2.2 checks that the commit is on master, 4.1 checks out the resolved commit.
          fetch-depth: 0
          persist-credentials: false

      - name: "2.2 Resolve the commit"
        id: s2_2
        env:
          MODE: ${{ inputs.mode }}
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          if [ "$MODE" = "deploy" ]; then
            commit="${COMMIT_INPUT,,}"
            if ! [[ "$commit" =~ ^([0-9a-f]{7,40}|master)$ ]]; then
              echo "::error::commit must be a full or short SHA, or master"
              exit 1
            fi
            if ! sha=$(git rev-parse --verify --quiet "${commit}^{commit}"); then
              echo "::error::commit $commit not found"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/master; then
              echo "::error::commit $sha is not on master"
              exit 1
            fi
          else
            # Only this one non-secret setting is queried; the list itself is never printed.
            sha=$(az webapp config appsettings list --resource-group "$RG" --name "$APP" \
              --query "[?name=='Deployment__Commit'].value | [0]" --output json | jq -r '. // empty')
            if [ -z "$sha" ]; then
              echo "::error::no deployed commit; run deploy"
              exit 1
            fi
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Deployment__Commit is not a full commit SHA; run deploy"
              exit 1
            fi
          fi
          echo "Commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # ---- 3: read and mask the hosted values (all modes) ----
      # Each value is masked as soon as it is read and before it is written to a step output. The outputs are
      # read only by the `env:` of 10.1 and 12.1.
      - name: "3.1 Read and mask the hosted settings"
        id: s3_1
        run: |
          shopt -s extglob
          missing=0

          # Connection strings: `value` is a string in current Azure CLI versions, an object in older ones.
          connection=$(az webapp config connection-string list --resource-group "$RG" --name "$APP" --output json \
            | jq -r '.[] | select(.name == "HabitTracker") | .value | if type == "object" then .value else . end // empty')
          if [ -z "$connection" ]; then
            echo "::error::configuration incomplete: HabitTracker"
            missing=1
          else
            echo "::add-mask::$connection"
            # Also mask the password on its own, should any tool print it outside the connection string.
            IFS=';' read -ra parts <<< "$connection"
            for part in "${parts[@]}"; do
              key="${part%%=*}"
              key="${key##+([[:space:]])}"
              key="${key%%+([[:space:]])}"
              case "${key,,}" in
                password|pwd)
                  if [[ "$part" == *=* ]] && [ -n "${part#*=}" ]; then echo "::add-mask::${part#*=}"; fi ;;
              esac
            done
            echo "connection=$connection" >> "$GITHUB_OUTPUT"
          fi

          settings=$(az webapp config appsettings list --resource-group "$RG" --name "$APP" --output json)
          for pair in \
            "Operator__AdministratorEmail admin_email" \
            "Operator__AdministratorPassword admin_password" \
            "Operator__DemoPassword demo_password"; do
            key="${pair% *}"
            output="${pair#* }"
            value=$(jq -r --arg key "$key" '.[] | select(.name == $key) | .value // empty' <<< "$settings")
            if [ -z "$value" ]; then
              echo "::error::configuration incomplete: $key"
              missing=1
              continue
            fi
            echo "::add-mask::$value"
            echo "$output=$value" >> "$GITHUB_OUTPUT"
          done
          unset settings value connection

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # ---- 4: check out the commit and build (all modes; publish in deploy, bundle in deploy and refresh) ----
      - name: "4.1 Check out the resolved commit"
        id: s4_1
        env:
          SHA: ${{ steps.s2_2.outputs.sha }}
        run: git checkout --quiet --detach "$SHA"

      - name: "4.2 Set up .NET"
        id: s4_2
        # v5 runs on Node 24 (v4 targets the deprecated Node 20). The HTTP 409 from
        # dotnetorigin.blob.core.windows.net on 2026-10-25 was a .NET release-day outage that hit
        # v5 and v6 alike and was fixed the same day (actions/setup-dotnet issue 794).
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: "4.3 Build the smoke check"
        id: s4_3
        # Built from the deployed commit in every mode: its expected values come from that commit's
        # HT.Application (contracts/smoke-check.md).
        run: dotnet build tools/HT.SmokeCheck/HT.SmokeCheck.csproj --configuration Release

      - name: "4.4 Publish the web app"
        id: s4_4
        if: inputs.mode == 'deploy'
        run: |
          dotnet publish src/HT.Ui -c Release -r linux-x64 --self-contained false -o publish
          (cd publish && zip -q -r ../publish.zip .)

      - name: "4.5 Build the migration bundle"
        id: s4_5
        if: inputs.mode == 'deploy' || inputs.mode == 'refresh'
        # The bundle reads its connection from HT_DESIGN_CONNECTION (HtDbContextFactory), set only in 10.1.
        # Only dotnet-ef is installed, at the version the tool manifest pins: `dotnet tool restore` on the .NET 10
        # SDK restores the manifest's tools in parallel and, on an empty cache, failed with "dotnet-ef ... is not
        # contained in the package" (first deploy run, 2026-11-15).
        # dotnet-ef needs the project's restore output; in refresh mode 4.4 does not run and restore nothing for it
        # (first refresh run, 2026-11-15: NETSDK1004 project.assets.json not found).
        run: |
          ef_version=$(jq -r '.tools["dotnet-ef"].version' dotnet-tools.json)
          dotnet tool install dotnet-ef --version "$ef_version" --tool-path "$RUNNER_TEMP/ef"
          dotnet restore src/HT.Persistence
          "$RUNNER_TEMP/ef/dotnet-ef" migrations bundle --project src/HT.Persistence --startup-project src/HT.Persistence \
            --self-contained -r linux-x64 --output efbundle

      # ---- 5: firewall rule for the runner, then delete the database (deploy, refresh) ----
      - name: "5.1 Add the runner firewall rule"
        id: s5_1
        if: inputs.mode == 'deploy' || inputs.mode == 'refresh'
        run: |
          ip=$(curl -fsS --retry 3 --max-time 20 https://api.ipify.org)
          if ! [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::could not read the runner's IPv4 address"
            exit 1
          fi
          # A rule left by a cancelled run has the same fixed name and is replaced.
          existing=$(az sql server firewall-rule list --resource-group "$RG" --server "$SQL_SERVER" \
            --query "length([?name=='$FIREWALL_RULE'])" --output tsv)
          if [ "$existing" != "0" ]; then
            az sql server firewall-rule delete --resource-group "$RG" --server "$SQL_SERVER" \
              --name "$FIREWALL_RULE" --output none
          fi
          az sql server firewall-rule create --resource-group "$RG" --server "$SQL_SERVER" \
            --name "$FIREWALL_RULE" --start-ip-address "$ip" --end-ip-address "$ip" --output none

      - name: "5.2 Delete the database"
        id: s5_2
        if: inputs.mode == 'deploy' || inputs.mode == 'refresh'
        run: |
          # A missing database (left by a failed run) is skipped; an Azure error fails the step.
          found=$(az sql db list --resource-group "$RG" --server "$SQL_SERVER" \
            --query "length([?name=='$SQL_DATABASE'])" --output tsv)
          if [ "$found" = "0" ]; then
            echo "No database to delete."
          else
            az sql db delete --resource-group "$RG" --server "$SQL_SERVER" --name "$SQL_DATABASE" --yes --output none
          fi

      # ---- 6: start the web app, so 7 never deploys into a stopped app (deploy) ----
      - name: "6.1 Start the web app"
        id: s6_1
        if: inputs.mode == 'deploy'
        run: az webapp start --resource-group "$RG" --name "$APP" --output none

      # ---- 7: deploy, recording the commit only after success (deploy) ----
      - name: "7.1 Deploy the web app"
        id: s7_1
        if: inputs.mode == 'deploy'
        env:
          SHA: ${{ steps.s2_2.outputs.sha }}
        run: |
          # Cleared first, so a refresh after a failed deployment stops at 2.2.
          az webapp config appsettings set --resource-group "$RG" --name "$APP" \
            --settings "Deployment__Commit=" --output none
          # --track-status false: the CLI would wait for the new version to start healthily, which it cannot do
          # here, without a database (5.2); step 8 stops it at once, and the smoke check (12) decides success.
          # With tracking, a start that missed the warm-up probe failed this step after 10 minutes (recovery
          # deploy run, 2026-11-15).
          az webapp deploy --resource-group "$RG" --name "$APP" --type zip --src-path publish.zip \
            --track-status false --output none
          az webapp config appsettings set --resource-group "$RG" --name "$APP" \
            --settings "Deployment__Commit=$SHA" --output none

      # ---- 8-11: stop, create the database, migrate, start (deploy, refresh) ----
      - name: "8.1 Stop the web app"
        id: s8_1
        if: inputs.mode == 'deploy' || inputs.mode == 'refresh'
        run: az webapp stop --resource-group "$RG" --name "$APP" --output none

      - name: "9.1 Create the database"
        id: s9_1
        if: inputs.mode == 'deploy' || inputs.mode == 'refresh'
        run: |
          az sql db create --resource-group "$RG" --server "$SQL_SERVER" --name "$SQL_DATABASE" \
            --service-objective Basic --output none

      - name: "10.1 Apply the migrations"
        id: s10_1
        if: inputs.mode == 'deploy' || inputs.mode == 'refresh'
        env:
          HT_DESIGN_CONNECTION: ${{ steps.s3_1.outputs.connection }}
        run: |
          # The firewall rule of 5.1 can take up to five minutes to apply: 1 attempt plus up to 3 retries,
          # 60 seconds apart. EF Core records each applied migration, so a retry continues where it stopped.
          chmod +x ./efbundle
          for attempt in 1 2 3 4; do
            if ./efbundle; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Migration bundle failed (attempt $attempt of 4); retrying in 60 seconds."
              sleep 60
            fi
          done
          echo "::error::the migration bundle failed after 3 retries"
          exit 1

      - name: "11.1 Start the web app"
        id: s11_1
        if: inputs.mode == 'deploy' || inputs.mode == 'refresh'
        run: |
          # Taken just before the start, so every operator-log line of this start follows it.
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "started=$started" >> "$GITHUB_OUTPUT"
          az webapp start --resource-group "$RG" --name "$APP" --output none
          echo "Web app started at $started (UTC)."

      # ---- 12: smoke check (all modes) ----
      - name: "12.1 Run the smoke check"
        id: s12_1
        env:
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
          HT_SMOKE_DEMO_PASSWORD: ${{ steps.s3_1.outputs.demo_password }}
          HT_SMOKE_ADMIN_EMAIL: ${{ steps.s3_1.outputs.admin_email }}
          HT_SMOKE_ADMIN_PASSWORD: ${{ steps.s3_1.outputs.admin_password }}
        run: |
          dotnet run --project tools/HT.SmokeCheck/HT.SmokeCheck.csproj --configuration Release --no-build \
            -- "$DEMO_BASE_URL"

      # ---- 13: always: remove the firewall rule, write the summary ----
      - name: "13.1 Remove the runner firewall rule"
        id: s13_1
        # Needs the Azure sign-in; without it no rule was added by this run.
        if: always() && steps.s1_2.outcome == 'success'
        run: |
          existing=$(az sql server firewall-rule list --resource-group "$RG" --server "$SQL_SERVER" \
            --query "length([?name=='$FIREWALL_RULE'])" --output tsv)
          if [ "$existing" = "0" ]; then
            echo "No firewall rule to remove."
          else
            az sql server firewall-rule delete --resource-group "$RG" --server "$SQL_SERVER" \
              --name "$FIREWALL_RULE" --output none
          fi

      - name: "13.2 Write the summary"
        id: s13_2
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ steps.s2_2.outputs.sha }}
          STARTED: ${{ steps.s11_1.outputs.started }}
          # One line per step, "<step name>=<outcome>", in contract order. Never toJSON(steps).
          OUTCOMES: |
            1.1 Check the ref is master=${{ steps.s1_1.outcome }}
            1.2 Sign in to Azure=${{ steps.s1_2.outcome }}
            2.1 Check out master=${{ steps.s2_1.outcome }}
            2.2 Resolve the commit=${{ steps.s2_2.outcome }}
            3.1 Read and mask the hosted settings=${{ steps.s3_1.outcome }}
            4.1 Check out the resolved commit=${{ steps.s4_1.outcome }}
            4.2 Set up .NET=${{ steps.s4_2.outcome }}
            4.3 Build the smoke check=${{ steps.s4_3.outcome }}
            4.4 Publish the web app=${{ steps.s4_4.outcome }}
            4.5 Build the migration bundle=${{ steps.s4_5.outcome }}
            5.1 Add the runner firewall rule=${{ steps.s5_1.outcome }}
            5.2 Delete the database=${{ steps.s5_2.outcome }}
            6.1 Start the web app=${{ steps.s6_1.outcome }}
            7.1 Deploy the web app=${{ steps.s7_1.outcome }}
            8.1 Stop the web app=${{ steps.s8_1.outcome }}
            9.1 Create the database=${{ steps.s9_1.outcome }}
            10.1 Apply the migrations=${{ steps.s10_1.outcome }}
            11.1 Start the web app=${{ steps.s11_1.outcome }}
            12.1 Run the smoke check=${{ steps.s12_1.outcome }}
            13.1 Remove the runner firewall rule=${{ steps.s13_1.outcome }}
        run: |
          failed_step=""
          cancelled_step=""
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "${line##*=}" in
              failure) [ -n "$failed_step" ] || failed_step="${line%=*}" ;;
              cancelled) [ -n "$cancelled_step" ] || cancelled_step="${line%=*}" ;;
            esac
          done <<< "$OUTCOMES"

          if [ -n "$failed_step" ] || [ -n "$cancelled_step" ]; then result="failed"; else result="succeeded"; fi

          {
            echo "## Demo ${MODE:-n/a}: $result"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | ${MODE:-n/a} |"
            echo "| Commit | ${SHA:-n/a} |"
            echo "| Result | $result |"
            if [ -n "$failed_step" ]; then
              echo "| Failed step | $failed_step |"
            elif [ -n "$cancelled_step" ]; then
              echo "| Cancelled at | $cancelled_step |"
            fi
            echo "| Web app started (step 11, UTC) | ${STARTED:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $result${failed_step:+ (first failed step: $failed_step)}"
