# Requests a Greptile review only after SonarQube Cloud is green on a PR.
#
# Greptile is a GitHub App, not an Actions step, so it cannot be ordered with `needs:`.
# Instead, .greptile/config.json sets "autoReview": [] (no automatic reviews), and this
# workflow posts the manual "@greptileai" trigger once the Sonar workflow succeeds.
#
# - Runs from the default branch's copy of this file (workflow_run semantics), so changes here
#   take effect only after they are merged to master.
# - Requests one review per head commit: each push whose Sonar quality gate passes gets a review.
#   The marker comment carries the commit SHA, so a re-run of the Sonar workflow on the same
#   commit does not request a second review. Commits that fail the gate are never sent.
# - A PR labelled `skip-greptile` gets no trigger. The label is read when the workflow runs, because
#   the workflow_run payload carries no labels. .greptile/config.json's "disabledLabels" only stops
#   automatic reviews; an explicit "@greptileai" comment still starts one.
# - Optional repo secret GREPTILE_TRIGGER_TOKEN: a fine-grained PAT (Pull requests: write) used
#   to post the trigger as a user, in case Greptile ignores comments from github-actions[bot].

name: Greptile review gate

on:
  workflow_run:
    workflows: ["SonarQube Cloud"]
    types: [completed]

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write

concurrency:
  group: greptile-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  request-review:
    name: Request Greptile review
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check Sonar quality gate and request review
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_TOKEN: ${{ secrets.GREPTILE_TRIGGER_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SONAR_CHECK: SonarCloud Code Analysis
          SKIP_LABEL: skip-greptile
          MARKER: "<!-- greptile-gate:${{ github.event.workflow_run.head_sha }} -->"
        run: |
          set -euo pipefail

          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No pull request attached to this run (fork PR?); nothing to do."
            exit 0
          fi

          labels=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name')
          if grep -qxF "$SKIP_LABEL" <<< "$labels"; then
            echo "::notice::PR #$PR_NUMBER is labelled '$SKIP_LABEL'; not requesting a Greptile review."
            exit 0
          fi

          # The Sonar workflow also succeeds when it skips analysis (no SONAR_TOKEN, no solution),
          # so require the quality-gate check that the SonarQube Cloud app posts on the head commit.
          conclusion=""
          for _ in $(seq 1 12); do
            run=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              -f check_name="$SONAR_CHECK" -X GET \
              --jq '.check_runs[0] // empty | "\(.status) \(.conclusion)"')
            if [ -n "$run" ] && [ "${run%% *}" = "completed" ]; then
              conclusion="${run#* }"
              break
            fi
            sleep 10
          done
          if [ "$conclusion" != "success" ]; then
            echo "::notice::'$SONAR_CHECK' is '${conclusion:-missing}' on $HEAD_SHA; not requesting a Greptile review."
            exit 0
          fi

          existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | wc -l)
          if [ "$existing" -gt 0 ]; then
            echo "::notice::Greptile review already requested for ${HEAD_SHA:0:7} on PR #$PR_NUMBER; skipping."
            exit 0
          fi

          GH_TOKEN="$TRIGGER_TOKEN" gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "@greptileai SonarQube Cloud is green on ${HEAD_SHA:0:7}; please review.
          $MARKER"
          echo "Requested a Greptile review on PR #$PR_NUMBER."
