<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">

<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>HabitCard — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div class="ht-grid-cards" style="max-width:760px"><article class="ht-card ht-habit">

  <div class="ht-habit__head"><h3 class="ht-habit__name">Reading</h3><span class="ht-spacer"></span><span class="ht-chip ht-chip--strong">2 goals</span></div>
  <div class="ht-habit__tags"><span class="ht-chip">Mind</span><span class="ht-chip">Build</span></div>
  <div class="ht-habit__start">Suggested start: <b>15 min, 5 days a week</b></div>
  <div class="ht-habit__actions"><button class="ht-btn ht-btn--secondary ht-btn--sm">Add another goal</button></div>
</article><article class="ht-card ht-habit">
  <div class="ht-habit__glyph"><svg class="ht-icon ht-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1" /><path d="m9 20 3-6 3 6" /><path d="m6 8 6 2 6-2" /><path d="M12 10v4" /></svg></div>
  <div class="ht-habit__head"><h3 class="ht-habit__name">Yoga</h3></div>
  <div class="ht-habit__tags"><span class="ht-chip">Body</span><span class="ht-chip">Build</span></div>
  <div class="ht-habit__start">Suggested start: <b>3 times a week</b></div>
  <div class="ht-habit__actions"><button class="ht-btn ht-btn--primary ht-btn--sm">Use this habit</button><button class="ht-btn ht-btn--ghost ht-btn--sm">Details</button></div>
</article><article class="ht-card ht-habit">
  <div class="ht-habit__glyph"><svg class="ht-icon ht-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2" /><path d="M12 18h.01" /></svg></div>
  <div class="ht-habit__head"><h3 class="ht-habit__name">Screen time</h3></div>

</article></div>
</div>
