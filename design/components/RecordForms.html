<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>RecordForms — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start"><div class="ht-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-yesno-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-yesno-t">Record · Yoga</h2><div class="ht-dialog__sub">Build · Mon · Wed · Fri</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><label class="ht-field"><span class="ht-field__label">For</span><select class="ht-input"><option>Today, Fri 30 Oct</option><option>Wed 28 Oct · Pending, 22 h left</option></select></label><div class="ht-field"><span class="ht-field__label">Did you do it?</span><div class="ht-seg" role="group" aria-label="Did you do it?"><button type="button" aria-pressed="true">Yes</button><button type="button" aria-pressed="false">No</button></div></div><label class="ht-field"><span class="ht-field__label">Note <span class="ht-muted" style="font-weight:400">(optional)</span></span><textarea class="ht-input ht-textarea" placeholder="What happened? Only you can see notes."></textarea></label></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--primary">Save record</button><button class="ht-btn ht-btn--secondary">Cancel</button><span class="ht-spacer"></span><button class="ht-btn ht-btn--ghost">Excuse instead</button></div>
</div><div class="ht-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-count-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-count-t">Record · Coffee</h2><div class="ht-dialog__sub">Reduce · at most 2 cups a day</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><label class="ht-field"><span class="ht-field__label">For</span><select class="ht-input"><option>Today, Fri 30 Oct</option><option>Wed 28 Oct · Pending, 22 h left</option></select></label><div class="ht-field"><span class="ht-field__label">Cups today</span><span class="ht-inline"><span class="ht-stepper"><button type="button" aria-label="Less">−</button><input type="number" value="1" aria-label="Cups"><button type="button" aria-label="More">+</button></span><span class="ht-unit">cups</span></span><span class="ht-field__help">At most 2. Enter 0 if you had none: an empty day cannot prove you stayed under the limit.</span></div></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--primary">Save record</button><button class="ht-btn ht-btn--secondary">Cancel</button></div>
</div></div>
</div>
</body>
</html>
