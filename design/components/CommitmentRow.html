<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>CommitmentRow — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div class="ht-card" style="max-width:640px"><h3 class="ht-card__title">Today</h3><div class="ht-row"><div class="ht-row__main"><div class="ht-row__name">Yoga</div><div class="ht-row__meta">Mon · Wed · Fri</div></div><span class="ht-chip ht-status ht-status--due">Due today</span><button class="ht-btn ht-btn--primary ht-btn--sm">Record</button></div>
<div class="ht-row"><div class="ht-row__main"><div class="ht-row__name">Reading</div><div class="ht-row__meta">12 of 20 min</div><div class="ht-progress" role="progressbar" aria-valuenow="12" aria-valuemax="20" aria-label="Reading progress"><span style="width:60%"></span></div></div><span class="ht-chip ht-status ht-status--due">Due today</span><button class="ht-btn ht-btn--secondary ht-btn--sm">Add time</button></div>
<div class="ht-row"><div class="ht-row__main"><div class="ht-row__name">Coffee <span class="ht-chip" style="margin-left:4px">Reduce</span></div><div class="ht-row__meta">1 of at most 2 cups</div></div><span class="ht-chip ht-status ht-status--met">Within limit</span><button class="ht-btn ht-btn--secondary ht-btn--sm">Record</button></div>
<div class="ht-row"><div class="ht-row__main"><div class="ht-row__name">Running</div><div class="ht-row__meta">Wednesday · 22 h left to record</div></div><span class="ht-chip ht-status ht-status--pending">Pending</span><button class="ht-btn ht-btn--secondary ht-btn--sm">Record</button><button class="ht-btn ht-btn--ghost ht-btn--sm">Excuse</button></div>
<div class="ht-row"><div class="ht-row__main"><div class="ht-row__name">Meditation</div><div class="ht-row__meta">Tuesday · no record</div></div><span class="ht-chip ht-status ht-status--missed">Missed</span><button class="ht-btn ht-btn--ghost ht-btn--sm">Add note</button></div></div>
</div>
</body>
</html>
