<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>FeedbackDialog — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div class="ht-dialog" style="margin:0 auto" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-t">Send feedback</h2><div class="ht-dialog__sub">Admins read every message</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><label class="ht-field"><span class="ht-field__label">Topic</span><select class="ht-input"><option>Something does not work</option><option>Idea for the app</option><option>Catalog content</option><option>Other</option></select></label><label class="ht-field"><span class="ht-field__label">Message</span><textarea class="ht-input ht-textarea" style="min-height:110px" placeholder="What happened, or what would help you?"></textarea><span class="ht-field__help">Do not paste private notes. Admins see your account email with the message.</span></label></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--primary">Send</button><button class="ht-btn ht-btn--secondary">Cancel</button></div>
</div>
</div>
</body>
</html>
