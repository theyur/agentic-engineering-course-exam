<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>NoteDialog — preview</title></head>
<body>
<div class="ht" style="padding:0">
<div class="ht-backdrop"><div class="ht-dialog" style="margin:0 auto" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-t">Add note · Meditation</h2><div class="ht-dialog__sub">Tue 27 Oct · Missed</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><label class="ht-field"><span class="ht-field__label">Note</span><textarea class="ht-input ht-textarea" style="min-height:120px">Late meeting, forgot to sit before bed.</textarea><span class="ht-field__help">Notes are private. They do not change the result.</span></label></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--primary">Save note</button><button class="ht-btn ht-btn--secondary">Cancel</button></div>
</div></div>
</div>
</body>
</html>
