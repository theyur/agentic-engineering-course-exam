<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>Dialog — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div class="ht-dialog" style="margin:0 auto" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-t">Excuse this commitment?</h2><div class="ht-dialog__sub">Running · Wed 28 Oct · Pending</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><p style="margin:0">An excused commitment is not counted in consistency. Your streak stays as it is.</p><label class="ht-field"><span class="ht-field__label">Reason <span class="ht-muted" style="font-weight:400">(optional)</span></span><input class="ht-input" placeholder="For example: travel, ill"></label></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--primary">Excuse</button><button class="ht-btn ht-btn--secondary">Cancel</button></div>
</div>
</div>
</body>
</html>
