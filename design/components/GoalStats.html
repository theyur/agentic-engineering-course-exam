<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>GoalStats — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div style="max-width:460px"><div class="ht-card">
  <div class="ht-eyebrow">Goal · commitment-based</div>
  <h3 class="ht-card__title" style="font-size:20px;margin-top:2px">Yoga, 3 times a week</h3>
  <div class="ht-stats">
    <div class="ht-stat"><div class="ht-stat__value">90% <small>(18 of 20)</small></div><div class="ht-stat__label">Consistency</div></div>
    <div class="ht-stat"><div class="ht-stat__value">6</div><div class="ht-stat__label">Streak, sessions</div></div>
    <div class="ht-stat"><div class="ht-stat__value">11</div><div class="ht-stat__label">Longest, sessions</div></div>
  </div>
  <div class="ht-strip" role="img" aria-label="Last 30 commitments: 18 met, 1 failed, 1 missed, 3 excused, 6 paused, 1 pending"><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--failed"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--paused"></i><i class="ht-strip__cell ht-cell--paused"></i><i class="ht-strip__cell ht-cell--paused"></i><i class="ht-strip__cell ht-cell--paused"></i><i class="ht-strip__cell ht-cell--paused"></i><i class="ht-strip__cell ht-cell--paused"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--excused"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--missed"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--excused"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--excused"></i><i class="ht-strip__cell ht-cell--pending"></i></div>
  <div class="ht-legend"><span><i class="ht-strip__cell ht-cell--met"></i>Met</span><span><i class="ht-strip__cell ht-cell--failed"></i>Failed</span><span><i class="ht-strip__cell ht-cell--missed"></i>Missed</span><span><i class="ht-strip__cell ht-cell--excused"></i>Excused</span><span><i class="ht-strip__cell ht-cell--paused"></i>Paused</span><span><i class="ht-strip__cell ht-cell--pending"></i>Pending</span></div>
</div></div>
</div>
</body>
</html>
