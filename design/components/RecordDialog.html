<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>RecordDialog — preview</title></head>
<body>
<div class="ht" style="padding:0">
<div class="ht-backdrop"><div class="ht-dialog" style="margin:0 auto" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-t">Record · Reading</h2><div class="ht-dialog__sub">Build · at least 20 min · every day</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><label class="ht-field"><span class="ht-field__label">For</span><select class="ht-input"><option>Today, Fri 30 Oct</option><option>Wed 28 Oct · Pending, 22 h left</option></select></label><div class="ht-field"><span class="ht-field__label">Time spent</span><span class="ht-inline"><span class="ht-stepper"><button type="button" aria-label="Less">−</button><input type="number" value="12" aria-label="Minutes"><button type="button" aria-label="More">+</button></span><span class="ht-unit">minutes</span></span><div class="ht-target"><span class="ht-progress" style="flex:1;margin:0;max-width:none"><span style="width:60%"></span></span>12 of 20 min</div><span class="ht-field__help">Partial time is kept. Below 20 min the day counts as Failed when it is finalized.</span></div><label class="ht-field"><span class="ht-field__label">Note <span class="ht-muted" style="font-weight:400">(optional)</span></span><textarea class="ht-input ht-textarea" placeholder="What happened? Only you can see notes."></textarea></label></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--primary">Save record</button><button class="ht-btn ht-btn--secondary">Cancel</button></div>
</div></div>
</div>
</body>
</html>
