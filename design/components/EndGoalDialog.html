<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>EndGoalDialog — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div class="ht-dialog" style="margin:0 auto" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-t">End goal · Yoga</h2><div class="ht-dialog__sub">Attempt 2 · started 14 Jul</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><p style="margin:0">Ending stops new commitments. Your history stays and nothing is counted as failed. To try again later you start a new attempt.</p><div class="ht-field"><span class="ht-field__label">How did it end?</span><div class="ht-choices" style="grid-template-columns:1fr"><label class="ht-choice"><input type="radio" name="o" checked><span class="ht-choice__title">Achieved</span><span class="ht-choice__desc">I reached what I wanted</span></label><label class="ht-choice"><input type="radio" name="o"><span class="ht-choice__title">Abandoned</span><span class="ht-choice__desc">I stopped trying</span></label><label class="ht-choice"><input type="radio" name="o"><span class="ht-choice__title">No longer relevant</span><span class="ht-choice__desc">My plans changed</span></label></div></div><label class="ht-field"><span class="ht-field__label">Note <span class="ht-muted" style="font-weight:400">(optional)</span></span><textarea class="ht-input ht-textarea" placeholder="What happened? Only you can see notes."></textarea></label></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--primary">End goal</button><button class="ht-btn ht-btn--secondary">Cancel</button></div>
</div>
</div>
</body>
</html>
