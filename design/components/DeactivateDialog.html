<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>DeactivateDialog — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div class="ht-dialog" style="margin:0 auto" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-t">Deactivate account?</h2><div class="ht-dialog__sub">anna.k@example.com · Anna K.</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><p style="margin:0">The person cannot sign in until you reactivate the account. Their data is kept, and they are removed from community views while deactivated.</p><label class="ht-field"><span class="ht-field__label">Reason</span><textarea class="ht-input ht-textarea" placeholder="Required. Shown in the account log for admins."></textarea></label></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--danger">Deactivate</button><button class="ht-btn ht-btn--secondary">Cancel</button></div>
</div>
</div>
</body>
</html>
