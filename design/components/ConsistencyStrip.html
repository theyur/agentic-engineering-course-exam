<!-- Slice 6 state (HP-001, HP-002, HP-006): Met, Failed, Missed and Pending cells and legend entries only (Excused and Paused come in slice 7). The full strip shows the last 30 ended results with the legend; the mini strip (ht-strip--mini) the last 15, with no legend. Both have role="img" and an aria-label that counts each state, a state with 0 left out; the mini strip's label replaces the full preview's "Last 15 results". -->
<div class="ht" style="padding:0 16px 16px" aria-label="Slice 6 state">
<div class="ht-eyebrow" style="margin:8px 0 8px">Slice 6 state · the full strip, 28 ended results, with its legend (the goal page, the visitor Home)</div>

<div class="ht-eyebrow" style="margin:24px 0 8px">Slice 6 state · the mini strip, the last 15, no legend (the Goals page)</div>
<div style="max-width:150px"><div class="ht-strip ht-strip--mini" role="img" aria-label="Last 15 commitments: 12 met, 1 missed, 2 pending"><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--missed"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--met"></i><i class="ht-strip__cell ht-cell--pending"></i><i class="ht-strip__cell ht-cell--pending"></i></div></div>
