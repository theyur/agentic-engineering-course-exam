<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>Button — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
<button class="ht-btn ht-btn--primary">Register free</button>
<button class="ht-btn ht-btn--secondary">Browse the catalog</button>
<button class="ht-btn ht-btn--ghost">Excuse</button>
<button class="ht-btn ht-btn--danger">Deactivate account</button>
<button class="ht-btn ht-btn--primary" disabled>Saving…</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px">
<button class="ht-btn ht-btn--primary ht-btn--sm">Record</button>
<button class="ht-btn ht-btn--secondary ht-btn--sm">Add time</button>
<button class="ht-btn ht-btn--ghost ht-btn--sm">Add note</button>
</div>
</div>
