<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>SuggestDialog — preview</title></head>
<body>
<div class="ht" style="padding:16px">
<div class="ht-dialog" style="margin:0 auto" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="ht-dialog__head"><div><h2 id="dlg-t">Suggest for catalog</h2><div class="ht-dialog__sub">Custom habit · Cold shower</div></div><button class="ht-dialog__close" aria-label="Close">×</button></div>
  <div class="ht-dialog__body"><p style="margin:0">An admin may publish an independent catalog habit based on this one, possibly edited. Your custom habit, goals, records and notes stay private and are not changed.</p><label class="ht-field"><span class="ht-field__label">Why is it useful for others? <span class="ht-muted" style="font-weight:400">(optional)</span></span><textarea class="ht-input ht-textarea" placeholder="One or two sentences for the admin"></textarea></label></div>
  <div class="ht-dialog__foot"><button class="ht-btn ht-btn--primary">Send suggestion</button><button class="ht-btn ht-btn--secondary">Cancel</button></div>
</div>
</div>
</body>
</html>
