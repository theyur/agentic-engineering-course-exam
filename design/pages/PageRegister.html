<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>PageRegister — preview</title></head>
<body>
<div class="ht ht-page">
<header class="ht-nav"><div class="ht-nav__inner"><a class="ht-nav__brand" href="#">Habit Tracker</a><nav class="ht-nav__links" aria-label="Main"><a href="#">Catalog</a><a href="#">Community</a></nav><div class="ht-nav__end"><a class="ht-btn ht-btn--ghost" href="#">Sign in</a><a class="ht-btn ht-btn--primary ht-btn--sm" href="#">Register</a><button class="ht-nav__menu-btn" aria-label="Menu" aria-expanded="false"><svg class="ht-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg></button></div></div></header><main class="ht-auth">
  <h1>Create your account</h1><p class="ht-muted" style="margin:0 0 20px">Free. Your goals, records and notes stay private.</p>
  <form class="ht-card ht-stack">
    <label class="ht-field"><span class="ht-field__label">Email</span><input class="ht-input" type="email" placeholder="you@example.com" autocomplete="email"></label>
    <label class="ht-field"><span class="ht-field__label">Password</span><input class="ht-input" type="password" autocomplete="new-password"><span class="ht-field__help">At least 8 characters, with a number.</span></label>
    <label class="ht-field"><span class="ht-field__label">Repeat password</span><input class="ht-input" type="password" autocomplete="new-password"></label>
    <div class="ht-notice ht-notice--neutral"><span>Community comparison is <b>off</b>. You can opt in later in your profile.</span></div>
    <button class="ht-btn ht-btn--primary ht-btn--block">Create account</button>
  </form>
  <p class="ht-auth__alt">Already have an account? <a href="#">Sign in</a></p>
</main><footer class="ht-footer"><div class="ht-footer__inner"><span>Habit Tracker · Agentic Engineering course project</span><span class="ht-spacer"></span><a href="#">Privacy</a><a href="#">Send feedback</a></div></footer>
</div>
</body>
</html>
