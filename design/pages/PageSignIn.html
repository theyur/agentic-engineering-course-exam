<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/ht-components.css"><title>PageSignIn — preview</title></head>
<body>
<div class="ht ht-page">
<header class="ht-nav"><div class="ht-nav__inner"><a class="ht-nav__brand" href="#">Habit Tracker</a><nav class="ht-nav__links" aria-label="Main"><a href="#">Catalog</a><a href="#">Community</a></nav><div class="ht-nav__end"><a class="ht-btn ht-btn--ghost ht-hide-sm" href="#">Sign in</a><a class="ht-btn ht-btn--primary ht-btn--sm ht-hide-sm" href="#">Register</a><button class="ht-nav__menu-btn" aria-label="Menu" aria-expanded="false"><svg class="ht-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg></button></div></div></header><main class="ht-auth">
  <h1>Sign in</h1><p class="ht-muted" style="margin:0 0 20px">Welcome back. Your goals are waiting.</p>
  <form class="ht-card ht-stack">
    <label class="ht-field"><span class="ht-field__label">Email</span><input class="ht-input" type="email" value="yuri@example.com" autocomplete="email"></label>
    <label class="ht-field"><span class="ht-field__label">Password</span><input class="ht-input" type="password" value="password12" aria-invalid="true" autocomplete="current-password"><span class="ht-field__error">Email or password is not correct.</span></label>
    <div class="ht-inline"><label class="ht-check"><input type="checkbox" checked> Keep me signed in</label><span class="ht-spacer"></span><a href="#" style="font-size:14px;font-weight:600">Forgot password?</a></div>
    <button class="ht-btn ht-btn--primary ht-btn--block">Sign in</button>
  </form>
  <p class="ht-auth__alt">New here? <a href="#">Create an account</a></p>
</main><footer class="ht-footer"><div class="ht-footer__inner"><span>Habit Tracker · Agentic Engineering course project</span><span class="ht-spacer"></span><a href="#">Privacy</a><a href="#">Send feedback</a></div></footer>
</div>
</body>
</html>
